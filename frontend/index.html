<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>研擎</title>
  <style>
    :root { --bg:#f4f7fb; --panel:#fff; --text:#17212b; --muted:#647284; --line:#dbe4ef; --blue:#195cff; --green:#0f8f6f; --red:#c93456; --amber:#ad7414; --soft:#f8fbff; --shadow:0 14px 30px rgba(35,48,70,.1); }
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif} button,input,textarea,select{font:inherit} .shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr} header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 26px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.88);backdrop-filter:blur(14px);position:sticky;top:0;z-index:5} h1,h2,p{margin:0} h1{font-size:24px} header p{margin-top:4px;color:var(--muted);font-size:13px}.header-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.badge{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--panel);font-size:12px} main{width:min(1360px,100%);margin:0 auto;padding:22px;display:grid;grid-template-columns:minmax(330px,.82fr) minmax(0,1.5fr);gap:16px;transition:grid-template-columns .18s ease}.panel,.card,.metric{border:1px solid var(--line);border-radius:8px;background:var(--panel);box-shadow:var(--shadow)}.panel{padding:18px}.form{display:grid;gap:13px} label{display:grid;gap:7px;color:var(--muted);font-size:13px} input,textarea,select{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--soft);color:var(--text);padding:11px 12px;outline:none} textarea{resize:vertical;min-height:92px;line-height:1.6} input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(25,92,255,.1)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap} button{min-height:42px;border:1px solid var(--blue);border-radius:7px;padding:0 15px;background:var(--blue);color:#fff;cursor:pointer;font-weight:700} button.secondary{color:var(--text);background:var(--panel);border-color:var(--line)}button:disabled{opacity:.52;cursor:not-allowed}.notice{display:none;margin-bottom:14px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:#eef3ff;color:#244173;line-height:1.6}.notice.show{display:block}.notice.error{background:#fff0f3;color:var(--red);border-color:rgba(201,52,86,.28)}.output{display:grid;gap:14px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.metric{min-height:96px;padding:15px;display:grid;gap:7px}.metric span,.card span,.history span,.source-list span{color:var(--muted);font-size:12px}.metric strong{font-size:22px;word-break:break-word}.core{padding:16px;border-left:4px solid var(--green);border-radius:7px;background:#eaf8f3;line-height:1.85}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{min-height:126px;padding:14px}.card strong{display:block;color:var(--green);margin-bottom:8px}ul{margin:0;padding-left:20px;color:var(--muted);line-height:1.75}.history,.results,.source-list{display:grid;gap:8px;max-height:280px;overflow:auto}.history button,.results button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;color:var(--text);background:var(--soft);border-color:var(--line);font-weight:600;text-align:left}.results button em{font-style:normal;color:var(--green);font-size:12px}.empty{min-height:360px;display:grid;place-items:center;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);margin-bottom:7px;font-size:18px}.snapshot{font-size:12px;color:var(--muted);line-height:1.6;word-break:break-word}.source-list article{padding:10px;border:1px solid var(--line);border-radius:7px;background:var(--soft)}.source-list strong{display:block;margin-bottom:4px}.warn{color:var(--amber)}body.sidebar-collapsed main{grid-template-columns:64px minmax(0,1fr)}body.sidebar-collapsed #sidebar{position:relative;min-height:180px;padding:12px;overflow:hidden}body.sidebar-collapsed #sidebar>*{display:none}body.sidebar-collapsed #sidebar:after{content:"研究工具";display:grid;place-items:center;height:100%;min-height:150px;color:var(--muted);font-size:13px;writing-mode:vertical-rl;letter-spacing:0}.print-title{display:none}@media(max-width:940px){main{grid-template-columns:1fr;padding:14px}.metrics,.grid,.row{grid-template-columns:1fr}header{padding:14px;align-items:flex-start;flex-direction:column}.header-tools{justify-content:flex-start}.actions{justify-content:stretch}.actions button{flex:1 1 150px}body.sidebar-collapsed main{grid-template-columns:1fr}body.sidebar-collapsed #sidebar{min-height:56px}body.sidebar-collapsed #sidebar:after{writing-mode:horizontal-tb;min-height:30px}}@media print{body{background:#fff;color:#000}header,#sidebar,.notice,button,.empty{display:none!important}.shell{display:block}main{display:block;width:100%;max-width:none;margin:0;padding:0}.output{display:block}.panel,.card,.metric{box-shadow:none;border-color:#ccd3dc;break-inside:avoid;page-break-inside:avoid}.panel{margin-bottom:12px}.grid,.metrics{grid-template-columns:1fr 1fr}.print-title{display:block;margin-bottom:12px;font-size:20px}.snapshot{color:#444}}
  </style>
</head>
<body>
<div class="shell">
  <header><div><h1>研擎</h1><p>独立个股深研工作台。输入股票，系统自动采集数据，再由 AI 拆基本盘、矛盾和证据链。</p></div><div class="header-tools"><button class="secondary" type="button" id="sidebarToggle">折叠左侧</button><button class="secondary" type="button" id="exportBtn" disabled>导出 PDF</button><span class="badge" id="health">未检查</span></div></header>
  <main>
    <section class="panel" id="sidebar">
      <div class="notice" id="notice"></div>
      <form class="form" id="autoForm" autocomplete="off">
        <label>股票名称 / 代码<input id="query" name="yanqing-stock-query" autocomplete="off" autocapitalize="off" spellcheck="false" required placeholder="例如：震安科技、震安、300767"></label>
        <div class="row"><label>研究深度<select id="depth"><option value="full">V1.1+V1.2 全量深研</option><option value="basics">基本盘画像</option><option value="financials">财务体检</option></select></label><label>指定代码（可选）<input id="ticker" name="yanqing-stock-code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="例如：300767.SZ"></label></div>
        <label>补充问题（可选）<textarea id="question" name="yanqing-research-question" autocomplete="off" spellcheck="false" placeholder="例如：收入下降但现金流改善，该怎么理解？减值是否出清？"></textarea></label>
        <label>补充材料（可选）<textarea id="supplemental" name="yanqing-supplemental-material" autocomplete="off" spellcheck="false" placeholder="可粘贴你额外掌握的公告、纪要、渠道信息；主流程不依赖手动输入。"></textarea></label>
        <div class="actions"><button class="secondary" type="button" id="searchBtn">搜索股票</button><button class="secondary" type="button" id="historyBtn">历史报告</button><button type="submit" id="submitBtn">自动采集并深研</button></div>
      </form>
      <section style="margin-top:14px"><h2>搜索结果</h2><div class="results" id="results"><span class="snapshot">输入名称或代码后搜索。</span></div></section>
      <section style="margin-top:14px"><h2>数据源</h2><div class="source-list" id="sources"><span class="snapshot">等待检查。</span></div></section>
    </section>
    <section class="output" id="output"><article class="panel empty"><div><strong>等待自动深研</strong><span>输入股票名称或代码，研擎会先采集数据快照，再生成研究驾驶舱。</span></div></article></section>
  </main>
</div>
<script>
const $=id=>document.getElementById(id); const api=path=>`/yanqing/api${path}`; let selectedTicker=''; let hasReport=false;
function toggleSidebar(){document.body.classList.toggle('sidebar-collapsed');$('sidebarToggle').textContent=document.body.classList.contains('sidebar-collapsed')?'展开左侧':'折叠左侧'}
function exportPdf(){if(!hasReport){notice('请先生成或打开一份报告。',true);return}window.print()}
function notice(text,error=false){const box=$('notice');box.textContent=text||'';box.className=`notice ${text?'show':''} ${error?'error':''}`}
async function json(path,options={}){const res=await fetch(api(path),{...options,headers:{'Content-Type':'application/json',...(options.headers||{})},cache:'no-store'});if(!res.ok){let msg=`HTTP ${res.status}`;try{const b=await res.json();msg=typeof b.detail==='string'?b.detail:(b.detail?.message||JSON.stringify(b.detail)||msg)}catch{}throw new Error(msg)}return res.json()}
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
function list(items){return `<ul>${(items&&items.length?items:['数据不足']).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}
function matrix(rows){return `<div class="grid">${(rows&&rows.length?rows:[{claim:'数据不足',supporting_evidence:[],opposing_evidence:[],data_gaps:['数据不足'],tracking_triggers:[]}]).map(row=>`<article class="card"><strong>${esc(row.claim||'数据不足')}</strong><span>支持证据</span>${list(row.supporting_evidence||[])}<span>反向证据</span>${list(row.opposing_evidence||[])}<span>数据缺口</span>${list(row.data_gaps||[])}<span>跟踪触发器</span>${list(row.tracking_triggers||[])}</article>`).join('')}</div>`}
function trackingFallback(r){const rows=r.contradiction_matrix||[];const triggers=[...new Set([...(rows.flatMap(row=>row.tracking_triggers||[])),...(r.tracking_triggers||[])].filter(Boolean))];return triggers.length?triggers.slice(0,8).map(trigger=>{const row=rows.find(x=>(x.tracking_triggers||[]).includes(trigger))||{};return {trigger,status:'watch',why:`用于验证：${row.claim||r.core_view||'核心矛盾'}`,evidence:[...(row.supporting_evidence||[]).slice(0,2),...(row.opposing_evidence||[]).slice(0,2)],next_check:`下一期财报、公告或订单披露继续核实：${trigger}`,invalidate_if:`${trigger}未出现，或相关反向证据继续增强`}}):[]}
function dashboard(items){const statusText={watch:'观察中',data_insufficient:'数据不足',confirmed:'已验证',invalidated:'已推翻'};return `<div class="grid">${(items&&items.length?items:[{trigger:'数据不足',status:'data_insufficient',why:'数据不足',evidence:['数据不足'],next_check:'数据不足',invalidate_if:'数据不足'}]).map(item=>`<article class="card"><strong>${esc(item.trigger||'数据不足')}</strong><span>状态：${esc(statusText[item.status]||item.status||'观察中')}</span><p>${esc(item.why||'数据不足')}</p><span>当前证据</span>${list(item.evidence||[])}<span>下一步检查</span><p>${esc(item.next_check||'数据不足')}</p><span>推翻条件</span><p>${esc(item.invalidate_if||'数据不足')}</p></article>`).join('')}</div>`}
function judgementView(j,r){const judgement=j&&Object.keys(j).length?j:{conclusion:`当前研判：${r.core_view||'数据不足'}`,confidence:{level:'数据不足',reason:'历史报告缺少结构化置信度'},base_case:{title:'最可能情景',description:r.investment_contradiction?.summary||'数据不足'},upside_case:{title:'增强情景',description:'数据不足'},downside_case:{title:'削弱情景',description:'数据不足'},strengthen_conditions:r.tracking_triggers||[],weaken_conditions:r.risks_and_disconfirming_evidence||[]};return `<section class="panel"><h2>当前研判</h2><p class="core">${esc(judgement.conclusion||'数据不足')}</p><p class="snapshot">置信度：${esc(judgement.confidence?.level||'数据不足')} · ${esc(judgement.confidence?.reason||'')}</p><div class="grid"><article class="card"><strong>${esc(judgement.base_case?.title||'最可能情景')}</strong><p>${esc(judgement.base_case?.description||'数据不足')}</p></article><article class="card"><strong>${esc(judgement.upside_case?.title||'增强情景')}</strong><p>${esc(judgement.upside_case?.description||'数据不足')}</p><span>增强条件</span>${list(judgement.strengthen_conditions||[])}</article><article class="card"><strong>${esc(judgement.downside_case?.title||'削弱情景')}</strong><p>${esc(judgement.downside_case?.description||'数据不足')}</p><span>削弱条件</span>${list(judgement.weaken_conditions||[])}</article></div></section>`}
function financialTrace(trace){const items=trace?.items||[];return `<section class="panel"><h2>财报字段追溯</h2><p class="snapshot">状态：${esc(trace?.status||'insufficient')} · 数据缺口：${trace?.data_gaps?.length?trace.data_gaps.map(esc).join('；'):'无'}</p><div class="grid">${items.length?items.map(item=>`<article class="card"><strong>${esc(item.label||item.field_key)}</strong><span>${esc(item.period||'数据不足')} · ${esc(item.source_label||item.source||'')}</span><p>${esc(item.value??'数据不足')} ${esc(item.unit||'')}</p><span>解释</span><p>${esc(item.interpretation||'数据不足')}</p><span>风险</span><p>${esc(item.risk||'数据不足')}</p></article>`).join(''):'<article class="card"><strong>数据不足</strong><span>当前快照没有可追溯的财报字段。</span></article>'}</div></section>`}
function sourceRender(data){$('sources').innerHTML=Object.entries(data).map(([k,v])=>`<article><strong>${esc(k)}</strong><span>${v.configured?'已配置':'未配置'} · ${esc(v.purpose||v.root||'')}</span></article>`).join('')}
async function loadEvidenceStatus(ticker){
  if(!ticker)return;
  try{
    const data=await json(`/evidence/${encodeURIComponent(ticker)}/sources/status`);
    notice(`证据源：${(data.sources||[]).map(s=>`${s.name}:${s.status}`).join('，')}`);
  }catch(e){}
}
async function searchStocks(){const q=$('query').value.trim(); if(!q)return; try{notice(''); const data=await json(`/stocks/search?q=${encodeURIComponent(q)}`); $('results').innerHTML=(data.results||[]).map(item=>`<button type="button" data-code="${esc(item.ts_code)}"><span>${esc(item.name)} · ${esc(item.ts_code)}<br><em>${esc(item.industry||'行业不足')} · ${esc(item.market||item.source||'')}</em></span><b>选择</b></button>`).join('')||'<span class="snapshot">没有找到，换更完整名称或代码。</span>'; document.querySelectorAll('[data-code]').forEach(btn=>btn.onclick=()=>{selectedTicker=btn.dataset.code;$('ticker').value=selectedTicker;notice(`已选择 ${selectedTicker}`);loadEvidenceStatus(selectedTicker)}); }catch(e){notice(e.message,true)}}
function render(payload){hasReport=true;$('exportBtn').disabled=false;const r=payload.report; const snap=payload.input_snapshot||{}; const d=snap.derived||{}; const evidenceLib = snap.evidence_library || {status:'insufficient',items:[],data_gaps:['公告原文数据不足']}; const digest=snap.evidence_digest||{status:'insufficient',items:[],financial_facts:[],open_questions:['数据不足'],data_gaps:[]}; const trace=snap.financial_traceability||{status:'insufficient',items:[],data_gaps:['财报字段追溯数据不足']}; const evidenceDisplay=r.evidence_display||{items:(r.evidence||[]).filter(e=>e&&e.quote),downgraded_count:(r.evidence||[]).filter(e=>e&&!e.quote&&String(e.note||'').includes('未能追溯')).length}; const trackingDashboard=(r.tracking_dashboard&&r.tracking_dashboard.length)?r.tracking_dashboard:trackingFallback(r); const downgradedNotice=evidenceDisplay.downgraded_count?`<p class="snapshot">已降级 ${esc(evidenceDisplay.downgraded_count)} 条不可追溯证据，原始审计信息仍保留在报告数据中。</p>`:''; $('output').innerHTML=`
<h1 class="print-title">研擎深研报告</h1>
<div class="metrics"><article class="metric"><span>标的</span><strong>${esc(payload.stock_name)}</strong><small>${esc(payload.ticker||'-')}</small></article><article class="metric"><span>数据质量</span><strong>${esc(r.data_quality)}</strong><small>${esc(d.latest_period||'-')}</small></article><article class="metric"><span>估值</span><strong>${esc(d.valuation?.pe_ttm??'不足')}</strong><small>PE TTM / PB ${esc(d.valuation?.pb??'-')}</small></article><article class="metric"><span>盈利质量</span><strong>${esc(d.profitability?.roe??'不足')}</strong><small>ROE / 毛利 ${esc(d.profitability?.grossprofit_margin??'-')}</small></article></div>
<section class="panel"><h2>${esc(r.title)}</h2><p class="core">${esc(r.core_view)}</p><p class="snapshot">快照：${esc(payload.snapshot_path||payload.storage_path||'')}</p></section>
${judgementView(r.research_judgement,r)}
<section class="grid"><article class="card"><strong>基本盘</strong>${list(r.business_basics)}</article><article class="card"><strong>核心矛盾</strong><p>${esc(r.investment_contradiction?.summary||'数据不足')}</p>${list([...(r.investment_contradiction?.positive||[]),...(r.investment_contradiction?.negative||[]),r.investment_contradiction?.key_question].filter(Boolean))}</article><article class="card"><strong>财务体检</strong>${list(r.financial_diagnosis)}</article><article class="card"><strong>政策订单链</strong>${list(r.policy_order_chain)}</article><article class="card"><strong>风险与反证</strong>${list(r.risks_and_disconfirming_evidence)}</article><article class="card"><strong>跟踪触发器</strong>${list(r.tracking_triggers)}</article></section>
<section class="panel"><h2>核心矛盾证据矩阵</h2>${matrix(r.contradiction_matrix||[])}</section>
<section class="panel"><h2>跟踪触发器仪表盘</h2>${dashboard(trackingDashboard)}</section>
<section class="panel"><h2>系统识别的异常</h2>${list((d.anomalies||[]).map(x=>`${x.item}：${x.observation}；${x.implication}`))}</section>
${financialTrace(trace)}
<section class="panel"><h2>可用证据摘要</h2><p class="snapshot">状态：${esc(digest.status||'insufficient')} · 数据缺口：${digest.data_gaps?.length?digest.data_gaps.map(esc).join('；'):'无'}</p><div class="grid">${(digest.financial_facts||[]).map(f=>`<article class="card"><strong>${esc(f.label||f.topic)}</strong><span>${esc(f.period||'-')}</span><p>${esc(f.observation||'数据不足')}</p></article>`).join('')}${(digest.items||[]).slice(0,8).map(item=>`<article class="card"><strong>${esc(item.label||item.topic)}</strong><span>${esc(item.source||'-')} · ${esc(item.date||'-')}</span><p>${esc(item.quote||'')}</p></article>`).join('')||'<article class="card"><strong>数据不足</strong><span>当前没有可摘要的公告/财报证据。</span></article>'}</div><h2 style="margin-top:14px">待核实问题</h2>${list(digest.open_questions||[])}</section>
<section class="panel"><h2>调研问题</h2>${list(r.research_questions)}</section>
<section class="panel"><h2>证据链</h2>${downgradedNotice}<div class="grid">${(evidenceDisplay.items||[]).map(e=>`<article class="card"><strong>${esc(e.source)}</strong><p>${esc(e.quote||'')}</p><span>${esc(e.note||'')}</span></article>`).join('')||'<article class="card"><strong>数据不足</strong><span>当前没有可直接展示的可追溯证据。</span></article>'}</div></section>
<section class="panel"><h2>公告原文证据</h2><p class="snapshot">状态：${esc(evidenceLib.status||'insufficient')} · 数据缺口：${evidenceLib.data_gaps?.length?evidenceLib.data_gaps.map(esc).join('；'):'无'}</p><div class="grid">${(evidenceLib.items||[]).map(item=>`<article class="card"><strong>${esc(item.title||'未命名文档')}</strong><span>日期：${esc(item.announcement_date||'-')} · 分类：${esc(item.category||'other')}</span><span>来源：${esc(item.source||'-')} · 文本抽取：${esc(item.text_extract_status||'skipped')}</span>${(item.snippets||[]).map(snippet=>`<p>${esc(snippet.quote||'')}</p>`).join('')||'<p class="snapshot">暂无摘录</p>'}${item.data_gaps?.length?`<span class="warn">${item.data_gaps.map(esc).join('；')}</span>`:''}</article>`).join('')||'<article class="card"><strong>暂无公告原文</strong><span>当前快照没有可展示的源文件证据。</span></article>'}</div></section>`}
async function autoResearch(e){e.preventDefault();$('submitBtn').disabled=true;notice('正在采集 TuShare/公开源数据并生成深研，这一步可能需要几十秒。');try{const payload={query:$('query').value.trim(),ticker:$('ticker').value.trim(),depth:$('depth').value,question:$('question').value.trim(),supplemental_materials:$('supplemental').value.trim()};render(await json('/research/auto',{method:'POST',body:JSON.stringify(payload)}));notice('自动深研已生成。')}catch(err){notice(err.message,true)}finally{$('submitBtn').disabled=false}}
async function loadHistory(){try{hasReport=false;$('exportBtn').disabled=true;const data=await json('/research/history');$('output').innerHTML=`<section class="panel"><h2>历史报告</h2><div class="history">${(data.items||[]).map(item=>`<button type="button" data-id="${esc(item.id)}"><span>${esc(item.stock_name)} · ${esc(item.ticker||'-')}<br>${esc(item.created_at?.slice(0,19).replace('T',' '))}</span><b>${esc(item.data_quality||'-')}</b></button>`).join('')||'<span>暂无历史</span>'}</div></section>`;document.querySelectorAll('[data-id]').forEach(btn=>btn.onclick=async()=>render(await json(`/research/${btn.dataset.id}`)))}catch(e){notice(e.message,true)}}
$('autoForm').onsubmit=autoResearch; $('searchBtn').onclick=searchStocks; $('historyBtn').onclick=loadHistory; $('sidebarToggle').onclick=toggleSidebar; $('exportBtn').onclick=exportPdf; $('query').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchStocks()}});
json('/health').then(h=>$('health').textContent=h.status==='ok'?'服务正常':'服务异常').catch(()=>$('health').textContent='服务未连接'); json('/data-source/status').then(sourceRender).catch(()=>{});
</script>
</body>
</html>
