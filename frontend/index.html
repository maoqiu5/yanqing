<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>研擎</title>
  <style>
    :root { --bg:#f4f7fb; --panel:#fff; --text:#17212b; --muted:#647284; --line:#dbe4ef; --blue:#195cff; --green:#0f8f6f; --red:#c93456; --amber:#ad7414; --soft:#f8fbff; --shadow:0 14px 30px rgba(35,48,70,.1); }
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif} button,input,textarea,select{font:inherit} .shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr} header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 26px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.88);backdrop-filter:blur(14px);position:sticky;top:0;z-index:5} h1,h2,p{margin:0} h1{font-size:24px} header p{margin-top:4px;color:var(--muted);font-size:13px}.badge{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--panel);font-size:12px} main{width:min(1360px,100%);margin:0 auto;padding:22px;display:grid;grid-template-columns:minmax(330px,.82fr) minmax(0,1.5fr);gap:16px}.panel,.card,.metric{border:1px solid var(--line);border-radius:8px;background:var(--panel);box-shadow:var(--shadow)}.panel{padding:18px}.form{display:grid;gap:13px} label{display:grid;gap:7px;color:var(--muted);font-size:13px} input,textarea,select{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--soft);color:var(--text);padding:11px 12px;outline:none} textarea{resize:vertical;min-height:92px;line-height:1.6} input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(25,92,255,.1)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap} button{min-height:42px;border:1px solid var(--blue);border-radius:7px;padding:0 15px;background:var(--blue);color:#fff;cursor:pointer;font-weight:700} button.secondary{color:var(--text);background:var(--panel);border-color:var(--line)}button:disabled{opacity:.52;cursor:not-allowed}.notice{display:none;margin-bottom:14px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:#eef3ff;color:#244173;line-height:1.6}.notice.show{display:block}.notice.error{background:#fff0f3;color:var(--red);border-color:rgba(201,52,86,.28)}.output{display:grid;gap:14px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.metric{min-height:96px;padding:15px;display:grid;gap:7px}.metric span,.card span,.history span,.source-list span{color:var(--muted);font-size:12px}.metric strong{font-size:22px;word-break:break-word}.core{padding:16px;border-left:4px solid var(--green);border-radius:7px;background:#eaf8f3;line-height:1.85}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{min-height:126px;padding:14px}.card strong{display:block;color:var(--green);margin-bottom:8px}ul{margin:0;padding-left:20px;color:var(--muted);line-height:1.75}.history,.results,.source-list{display:grid;gap:8px;max-height:280px;overflow:auto}.history button,.results button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;color:var(--text);background:var(--soft);border-color:var(--line);font-weight:600;text-align:left}.results button em{font-style:normal;color:var(--green);font-size:12px}.empty{min-height:360px;display:grid;place-items:center;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);margin-bottom:7px;font-size:18px}.snapshot{font-size:12px;color:var(--muted);line-height:1.6;word-break:break-word}.source-list article{padding:10px;border:1px solid var(--line);border-radius:7px;background:var(--soft)}.source-list strong{display:block;margin-bottom:4px}.warn{color:var(--amber)} @media(max-width:940px){main{grid-template-columns:1fr;padding:14px}.metrics,.grid,.row{grid-template-columns:1fr}header{padding:14px;align-items:flex-start;flex-direction:column}.actions{justify-content:stretch}.actions button{flex:1 1 150px}}
  </style>
</head>
<body>
<div class="shell">
  <header><div><h1>研擎</h1><p>独立个股深研工作台。输入股票，系统自动采集数据，再由 AI 拆基本盘、矛盾和证据链。</p></div><span class="badge" id="health">未检查</span></header>
  <main>
    <section class="panel">
      <div class="notice" id="notice"></div>
      <form class="form" id="autoForm">
        <label>股票名称 / 代码<input id="query" required placeholder="例如：震安科技、震安、300767"></label>
        <div class="row"><label>研究深度<select id="depth"><option value="full">V1.1+V1.2 全量深研</option><option value="basics">基本盘画像</option><option value="financials">财务体检</option></select></label><label>指定代码（可选）<input id="ticker" placeholder="例如：300767.SZ"></label></div>
        <label>补充问题（可选）<textarea id="question" placeholder="例如：收入下降但现金流改善，该怎么理解？减值是否出清？"></textarea></label>
        <label>补充材料（可选）<textarea id="supplemental" placeholder="可粘贴你额外掌握的公告、纪要、渠道信息；主流程不依赖手动输入。"></textarea></label>
        <div class="actions"><button class="secondary" type="button" id="searchBtn">搜索股票</button><button class="secondary" type="button" id="historyBtn">历史报告</button><button type="submit" id="submitBtn">自动采集并深研</button></div>
      </form>
      <section style="margin-top:14px"><h2>搜索结果</h2><div class="results" id="results"><span class="snapshot">输入名称或代码后搜索。</span></div></section>
      <section style="margin-top:14px"><h2>数据源</h2><div class="source-list" id="sources"><span class="snapshot">等待检查。</span></div></section>
    </section>
    <section class="output" id="output"><article class="panel empty"><div><strong>等待自动深研</strong><span>输入股票名称或代码，研擎会先采集数据快照，再生成研究驾驶舱。</span></div></article></section>
  </main>
</div>
<script>
const $=id=>document.getElementById(id); const api=path=>`/yanqing/api${path}`; let selectedTicker='';
function notice(text,error=false){const box=$('notice');box.textContent=text||'';box.className=`notice ${text?'show':''} ${error?'error':''}`}
async function json(path,options={}){const res=await fetch(api(path),{...options,headers:{'Content-Type':'application/json',...(options.headers||{})},cache:'no-store'});if(!res.ok){let msg=`HTTP ${res.status}`;try{const b=await res.json();msg=typeof b.detail==='string'?b.detail:(b.detail?.message||JSON.stringify(b.detail)||msg)}catch{}throw new Error(msg)}return res.json()}
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
function list(items){return `<ul>${(items&&items.length?items:['数据不足']).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}
function sourceRender(data){$('sources').innerHTML=Object.entries(data).map(([k,v])=>`<article><strong>${esc(k)}</strong><span>${v.configured?'已配置':'未配置'} · ${esc(v.purpose||v.root||'')}</span></article>`).join('')}
async function loadEvidenceStatus(ticker){
  if(!ticker)return;
  try{
    const data=await json(`/evidence/${encodeURIComponent(ticker)}/sources/status`);
    notice(`证据源：${(data.sources||[]).map(s=>`${s.name}:${s.status}`).join('，')}`);
  }catch(e){}
}
async function searchStocks(){const q=$('query').value.trim(); if(!q)return; try{notice(''); const data=await json(`/stocks/search?q=${encodeURIComponent(q)}`); $('results').innerHTML=(data.results||[]).map(item=>`<button type="button" data-code="${esc(item.ts_code)}"><span>${esc(item.name)} · ${esc(item.ts_code)}<br><em>${esc(item.industry||'行业不足')} · ${esc(item.market||item.source||'')}</em></span><b>选择</b></button>`).join('')||'<span class="snapshot">没有找到，换更完整名称或代码。</span>'; document.querySelectorAll('[data-code]').forEach(btn=>btn.onclick=()=>{selectedTicker=btn.dataset.code;$('ticker').value=selectedTicker;notice(`已选择 ${selectedTicker}`);loadEvidenceStatus(selectedTicker)}); }catch(e){notice(e.message,true)}}
function render(payload){const r=payload.report; const snap=payload.input_snapshot||{}; const d=snap.derived||{}; const evidenceLib = snap.evidence_library || {status:'insufficient',items:[],data_gaps:['公告原文数据不足']}; $('output').innerHTML=`
<div class="metrics"><article class="metric"><span>标的</span><strong>${esc(payload.stock_name)}</strong><small>${esc(payload.ticker||'-')}</small></article><article class="metric"><span>数据质量</span><strong>${esc(r.data_quality)}</strong><small>${esc(d.latest_period||'-')}</small></article><article class="metric"><span>估值</span><strong>${esc(d.valuation?.pe_ttm??'不足')}</strong><small>PE TTM / PB ${esc(d.valuation?.pb??'-')}</small></article><article class="metric"><span>盈利质量</span><strong>${esc(d.profitability?.roe??'不足')}</strong><small>ROE / 毛利 ${esc(d.profitability?.grossprofit_margin??'-')}</small></article></div>
<section class="panel"><h2>${esc(r.title)}</h2><p class="core">${esc(r.core_view)}</p><p class="snapshot">快照：${esc(payload.snapshot_path||payload.storage_path||'')}</p></section>
<section class="grid"><article class="card"><strong>基本盘</strong>${list(r.business_basics)}</article><article class="card"><strong>核心矛盾</strong><p>${esc(r.investment_contradiction?.summary||'数据不足')}</p>${list([...(r.investment_contradiction?.positive||[]),...(r.investment_contradiction?.negative||[]),r.investment_contradiction?.key_question].filter(Boolean))}</article><article class="card"><strong>财务体检</strong>${list(r.financial_diagnosis)}</article><article class="card"><strong>政策订单链</strong>${list(r.policy_order_chain)}</article><article class="card"><strong>风险与反证</strong>${list(r.risks_and_disconfirming_evidence)}</article><article class="card"><strong>跟踪触发器</strong>${list(r.tracking_triggers)}</article></section>
<section class="panel"><h2>系统识别的异常</h2>${list((d.anomalies||[]).map(x=>`${x.item}：${x.observation}；${x.implication}`))}</section>
<section class="panel"><h2>调研问题</h2>${list(r.research_questions)}</section>
<section class="panel"><h2>证据链</h2><div class="grid">${(r.evidence||[]).map(e=>`<article class="card"><strong>${esc(e.source)}</strong><p>${esc(e.quote||'')}</p><span>${esc(e.note||'')}</span></article>`).join('')||'<article class="card"><strong>数据不足</strong></article>'}</div></section>
<section class="panel"><h2>公告原文证据</h2><p class="snapshot">状态：${esc(evidenceLib.status||'insufficient')} · 数据缺口：${evidenceLib.data_gaps?.length?evidenceLib.data_gaps.map(esc).join('；'):'无'}</p><div class="grid">${(evidenceLib.items||[]).map(item=>`<article class="card"><strong>${esc(item.title||'未命名文档')}</strong><span>日期：${esc(item.announcement_date||'-')} · 分类：${esc(item.category||'other')}</span><span>来源：${esc(item.source||'-')} · 文本抽取：${esc(item.text_extract_status||'skipped')}</span>${(item.snippets||[]).map(snippet=>`<p>${esc(snippet.quote||'')}</p>`).join('')||'<p class="snapshot">暂无摘录</p>'}${item.data_gaps?.length?`<span class="warn">${item.data_gaps.map(esc).join('；')}</span>`:''}</article>`).join('')||'<article class="card"><strong>暂无公告原文</strong><span>当前快照没有可展示的源文件证据。</span></article>'}</div></section>`}
async function autoResearch(e){e.preventDefault();$('submitBtn').disabled=true;notice('正在采集 TuShare/公开源数据并生成深研，这一步可能需要几十秒。');try{const payload={query:$('query').value.trim(),ticker:$('ticker').value.trim(),depth:$('depth').value,question:$('question').value.trim(),supplemental_materials:$('supplemental').value.trim()};render(await json('/research/auto',{method:'POST',body:JSON.stringify(payload)}));notice('自动深研已生成。')}catch(err){notice(err.message,true)}finally{$('submitBtn').disabled=false}}
async function loadHistory(){try{const data=await json('/research/history');$('output').innerHTML=`<section class="panel"><h2>历史报告</h2><div class="history">${(data.items||[]).map(item=>`<button type="button" data-id="${esc(item.id)}"><span>${esc(item.stock_name)} · ${esc(item.ticker||'-')}<br>${esc(item.created_at?.slice(0,19).replace('T',' '))}</span><b>${esc(item.data_quality||'-')}</b></button>`).join('')||'<span>暂无历史</span>'}</div></section>`;document.querySelectorAll('[data-id]').forEach(btn=>btn.onclick=async()=>render(await json(`/research/${btn.dataset.id}`)))}catch(e){notice(e.message,true)}}
$('autoForm').onsubmit=autoResearch; $('searchBtn').onclick=searchStocks; $('historyBtn').onclick=loadHistory; $('query').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchStocks()}});
json('/health').then(h=>$('health').textContent=h.status==='ok'?'服务正常':'服务异常').catch(()=>$('health').textContent='服务未连接'); json('/data-source/status').then(sourceRender).catch(()=>{});
</script>
</body>
</html>
